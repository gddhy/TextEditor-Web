<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="color-scheme" content="light dark">
<title>文本编辑器</title>
<meta name="description" content="基于 Monaco Editor 的 Web 文本编辑器，支持多编码、Markdown 预览、PWA 文件关联。">
<meta name="theme-color" content="#6750A4" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#6750A4" media="(prefers-color-scheme: dark)">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Text Editor">
<link rel="manifest" href="./manifest.json">
<link rel="icon" href="./icons/favicon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="./icons/icon-192.png">
<link rel="stylesheet" href="./css/app.css">
<link rel="stylesheet" href="./css/diff.css">
</head>
<body class="booting">

<!-- ============ 启动遮罩 ============ -->
<div id="splash" class="splash">
  <div class="splash-inner">
    <svg class="splash-logo" viewBox="0 0 96 96" aria-hidden="true">
      <rect x="8" y="8" width="80" height="80" rx="24" fill="var(--md-primary)"/>
      <path d="M34 30h28M34 44h28M34 58h18" stroke="var(--md-on-primary)" stroke-width="6" stroke-linecap="round"/>
    </svg>
    <div class="splash-title">文本编辑器</div>
    <div class="linear-progress"><div class="linear-progress-bar"></div></div>
    <div class="splash-status" id="splashStatus">正在准备编辑器…</div>
    <div class="splash-source" id="splashSource"></div>
  </div>
</div>

<div class="app" id="app" hidden>

  <!-- ============ 顶部应用栏 ============ -->
  <header class="appbar">
    <div class="appbar-lead">
      <button class="icon-btn" id="btnMenu" title="主菜单" aria-label="主菜单">
        <svg viewBox="0 0 24 24"><path d="M3 6h18M3 12h18M3 18h18"/></svg>
      </button>
      <div class="appbar-brand">
        <svg class="brand-mark" viewBox="0 0 24 24" aria-hidden="true">
          <rect x="2" y="2" width="20" height="20" rx="6" fill="var(--md-primary)"/>
          <path d="M8 8h8M8 12h8M8 16h5" stroke="var(--md-on-primary)" stroke-width="1.8" stroke-linecap="round" fill="none"/>
        </svg>
        <span class="brand-name">文本编辑器</span>
      </div>
    </div>

    <div class="appbar-actions">
      <button class="icon-btn" id="btnNew" title="新建文件 (Ctrl+N)" aria-label="新建">
        <svg viewBox="0 0 24 24"><path d="M14 3H7a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h10a2 2 0 0 0 2-2V8z"/><path d="M14 3v5h5"/><path d="M12 11v6M9 14h6"/></svg>
      </button>
      <button class="icon-btn" id="btnOpen" title="打开文件 (Ctrl+O)" aria-label="打开">
        <svg viewBox="0 0 24 24"><path d="M3 7a2 2 0 0 1 2-2h4l2 2h8a2 2 0 0 1 2 2v8a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/></svg>
      </button>
      <button class="icon-btn" id="btnSave" title="保存到原文件 (Ctrl+S)" aria-label="保存">
        <svg viewBox="0 0 24 24"><path d="M19 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h11l5 5v11a2 2 0 0 1-2 2z"/><path d="M17 21v-8H7v8M7 3v5h8"/></svg>
      </button>
      <button class="icon-btn" id="btnDownload" title="下载到本地 (Ctrl+Shift+D)" aria-label="下载">
        <svg viewBox="0 0 24 24"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><path d="M7 10l5 5 5-5M12 15V3"/></svg>
      </button>
      <span class="appbar-divider"></span>
      <button class="icon-btn toggle" id="btnPreview" title="预览 (Ctrl+Shift+V)" aria-label="预览" hidden>
        <svg viewBox="0 0 24 24"><path d="M2 12s3.6-7 10-7 10 7 10 7-3.6 7-10 7S2 12 2 12z"/><circle cx="12" cy="12" r="3"/></svg>
      </button>
      <button class="icon-btn" id="btnTheme" title="切换主题" aria-label="切换主题">
        <svg viewBox="0 0 24 24" class="ic-light"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></svg>
        <svg viewBox="0 0 24 24" class="ic-dark"><path d="M21 12.8A9 9 0 1 1 11.2 3a7 7 0 0 0 9.8 9.8z"/></svg>
      </button>
      <button class="icon-btn" id="btnOverflow" title="更多" aria-label="更多">
        <svg viewBox="0 0 24 24"><circle cx="12" cy="5" r="1.6" fill="currentColor" stroke="none"/><circle cx="12" cy="12" r="1.6" fill="currentColor" stroke="none"/><circle cx="12" cy="19" r="1.6" fill="currentColor" stroke="none"/></svg>
      </button>
    </div>
  </header>

  <!-- ============ 标签栏 ============ -->
  <nav class="tabbar" id="tabbar">
    <div class="tabs" id="tabs" role="tablist"></div>
    <button class="icon-btn small tab-add" id="btnTabAdd" title="新建标签页" aria-label="新建标签页">
      <svg viewBox="0 0 24 24"><path d="M12 5v14M5 12h14"/></svg>
    </button>
  </nav>

  <!-- ============ 工作区 ============ -->
  <main class="workarea" id="workarea">
    <section class="pane pane-editor" id="paneEditor">
      <div id="editor" class="monaco-host"></div>
      <div class="drop-hint" id="dropHint">
        <svg viewBox="0 0 24 24"><path d="M12 16V4M7 9l5-5 5 5"/><path d="M4 16v2a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2v-2"/></svg>
        <span>松开以打开文件</span>
      </div>
    </section>
    <div class="splitter" id="splitter" role="separator" aria-orientation="vertical" hidden></div>
    <section class="pane pane-preview" id="panePreview" hidden>
      <div class="preview-bar">
        <span class="preview-title" id="previewTitle">预览</span>
        <div class="spacer"></div>
        <button class="icon-btn small" id="btnPreviewSync" title="滚动同步" aria-label="滚动同步">
          <svg viewBox="0 0 24 24"><path d="M17 2l4 4-4 4"/><path d="M3 11V9a4 4 0 0 1 4-4h14"/><path d="M7 22l-4-4 4-4"/><path d="M21 13v2a4 4 0 0 1-4 4H3"/></svg>
        </button>
        <button class="icon-btn small" id="btnPreviewClose" title="关闭预览" aria-label="关闭预览">
          <svg viewBox="0 0 24 24"><path d="M18 6L6 18M6 6l12 12"/></svg>
        </button>
      </div>
      <article class="markdown-body" id="preview"></article>
      <iframe class="preview-frame" id="previewFrame" hidden
        sandbox="allow-same-origin allow-popups allow-modals"
        referrerpolicy="no-referrer"></iframe>
    </section>
  </main>

  <!-- ============ 文本对比视图 ============ -->
  <section class="diff-view" id="diffView" hidden>
    <div class="diff-bar">
      <div class="diff-left-area">
        <span class="diff-title">文本对比</span>
        <div class="diff-side">
          <span class="diff-side-label">左侧（原）</span>
          <select class="diff-sel" id="diffLeftSel"><option value="">— 空白 —</option></select>
          <button class="diff-btn" id="diffLeftOpen">打开文件</button>
          <button class="diff-btn" id="diffLeftPaste">粘贴</button>
        </div>
      </div>
      <div class="diff-spacer"></div>
      <div class="diff-right-area">
        <div class="diff-side">
          <span class="diff-side-label">右侧（改）</span>
          <select class="diff-sel" id="diffRightSel"><option value="">— 空白 —</option></select>
          <button class="diff-btn" id="diffRightOpen">打开文件</button>
          <button class="diff-btn" id="diffRightPaste">粘贴</button>
        </div>
      </div>
      <div class="diff-actions">
        <button class="diff-btn" id="diffSwap">交换两侧</button>
        <button class="diff-btn" id="diffClose">关闭</button>
      </div>
    </div>
    <div class="diff-body">
      <div class="diff-editor" id="diffEditor"></div>
      <div class="diff-overview" id="diffOverview" title="差异位置（点击跳转到对应行）"></div>
      <!-- 差异计算中的遮罩：Monaco 的 diff 在 web worker 里算，首次需下载 worker 脚本，
           这里给出明确反馈，超时后提供重试入口，避免"一直空白不知道在干嘛" -->
      <div class="diff-loading" id="diffLoading" hidden></div>
    </div>
  </section>

  <!-- ============ 状态栏 ============ -->
  <footer class="statusbar">
    <button class="status-item" id="stFile" title="当前文件">
      <svg viewBox="0 0 24 24"><path d="M14 3H7a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h10a2 2 0 0 0 2-2V8z"/><path d="M14 3v5h5"/></svg>
      <span id="stFileText">未命名</span>
    </button>
    <span class="status-flex"></span>
    <button class="status-item" id="stCursor" title="跳转到行 (Ctrl+G)">行 1，列 1</button>
    <button class="status-item" id="stSelection" hidden>已选 0</button>
    <button class="status-item" id="stIndent" title="缩进设置">空格: 2</button>
    <button class="status-item" id="stEol" title="行尾序列">LF</button>
    <button class="status-item" id="stEncoding" title="文件编码">UTF-8</button>
    <button class="status-item" id="stLang" title="语言模式">纯文本</button>
    <button class="status-item" id="stCdn" title="资源镜像源">CDN</button>
  </footer>
</div>

<!-- ============ 菜单 ============ -->
<div class="menu" id="mainMenu" hidden>
  <button class="menu-item" data-act="new"><svg viewBox="0 0 24 24"><path d="M14 3H7a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h10a2 2 0 0 0 2-2V8z"/><path d="M14 3v5h5"/></svg><span>新建文件</span><kbd>Ctrl+N</kbd></button>
  <button class="menu-item" data-act="open"><svg viewBox="0 0 24 24"><path d="M3 7a2 2 0 0 1 2-2h4l2 2h8a2 2 0 0 1 2 2v8a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/></svg><span>打开文件…</span><kbd>Ctrl+O</kbd></button>
  <button class="menu-item" data-act="openWithEncoding"><svg viewBox="0 0 24 24"><path d="M4 7V4h16v3M9 20h6M12 4v16"/></svg><span>以指定编码打开…</span></button>
  <button class="menu-item" data-act="openFolder"><svg viewBox="0 0 24 24"><path d="M3 7a2 2 0 0 1 2-2h4l2 2h8a2 2 0 0 1 2 2v8a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/></svg><span>打开文件夹…</span></button>
  <button class="menu-item" data-act="reloadDisk"><svg viewBox="0 0 24 24"><path d="M21 12a9 9 0 1 1-2.6-6.4"/><path d="M21 3v6h-6"/></svg><span>从磁盘重新加载</span></button>
  <div class="menu-sep"></div>
  <button class="menu-item" data-act="save"><svg viewBox="0 0 24 24"><path d="M19 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h11l5 5v11a2 2 0 0 1-2 2z"/><path d="M17 21v-8H7v8M7 3v5h8"/></svg><span>保存（覆写原文件）</span><kbd>Ctrl+S</kbd></button>
  <button class="menu-item" data-act="saveAs"><svg viewBox="0 0 24 24"><path d="M19 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h11l5 5v11a2 2 0 0 1-2 2z"/><path d="M12 11v6M9 14h6"/></svg><span>另存为…</span><kbd>Ctrl+Shift+S</kbd></button>
  <button class="menu-item" data-act="saveWithEncoding"><svg viewBox="0 0 24 24"><path d="M4 7V4h16v3M9 20h6M12 4v16"/></svg><span>以指定编码保存…</span></button>
  <button class="menu-item" data-act="download"><svg viewBox="0 0 24 24"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><path d="M7 10l5 5 5-5M12 15V3"/></svg><span>下载当前文件</span><kbd>Ctrl+Shift+D</kbd></button>
  <button class="menu-item" data-act="saveAll"><svg viewBox="0 0 24 24"><path d="M19 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h11l5 5v11a2 2 0 0 1-2 2z"/></svg><span>全部保存</span></button>
  <div class="menu-sep"></div>
  <button class="menu-item" data-act="find"><svg viewBox="0 0 24 24"><circle cx="11" cy="11" r="7"/><path d="M21 21l-4.3-4.3"/></svg><span>查找</span><kbd>Ctrl+F</kbd></button>
  <button class="menu-item" data-act="replace"><svg viewBox="0 0 24 24"><path d="M14 4h6v6M20 4l-8 8M10 20H4v-6M4 20l8-8"/></svg><span>替换</span><kbd>Ctrl+H</kbd></button>
  <button class="menu-item" data-act="format"><svg viewBox="0 0 24 24"><path d="M4 6h16M4 12h10M4 18h14"/></svg><span>格式化文档</span><kbd>Shift+Alt+F</kbd></button>
  <button class="menu-item" data-act="palette"><svg viewBox="0 0 24 24"><path d="M4 6h16M4 12h16M4 18h16"/></svg><span>命令面板</span><kbd>F1</kbd></button>
  <button class="menu-item" data-act="compare"><svg viewBox="0 0 24 24"><path d="M3 5h7v14H3zM14 5h7v14h-7zM10 9l3 3-3 3"/></svg><span>文本对比</span><kbd>Ctrl+Shift+C</kbd></button>
  <div class="menu-sep"></div>
  <button class="menu-item" data-act="settings"><svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.7 1.7 0 0 0 .3 1.9l.1.1a2 2 0 1 1-2.8 2.8l-.1-.1a1.7 1.7 0 0 0-2.9 1.2v.2a2 2 0 1 1-4 0v-.1a1.7 1.7 0 0 0-1.1-1.6 1.7 1.7 0 0 0-1.9.4l-.1.1a2 2 0 1 1-2.8-2.8l.1-.1a1.7 1.7 0 0 0-1.2-2.9H3a2 2 0 1 1 0-4h.1a1.7 1.7 0 0 0 1.2-2.9l-.1-.1a2 2 0 1 1 2.8-2.8l.1.1a1.7 1.7 0 0 0 1.9.3H9a1.7 1.7 0 0 0 1-1.5V3a2 2 0 1 1 4 0v.1a1.7 1.7 0 0 0 2.9 1.2l.1-.1a2 2 0 1 1 2.8 2.8l-.1.1a1.7 1.7 0 0 0-.3 1.9V9a1.7 1.7 0 0 0 1.5 1H21a2 2 0 1 1 0 4h-.1a1.7 1.7 0 0 0-1.5 1z"/></svg><span>设置</span></button>
  <button class="menu-item" data-act="install"><svg viewBox="0 0 24 24"><path d="M12 3v12M8 11l4 4 4-4"/><path d="M4 17v2a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2v-2"/></svg><span>安装为应用</span></button>
  <button class="menu-item" data-act="welcome"><svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="9"/><path d="M9.5 9a2.5 2.5 0 1 1 3.5 2.3c-.8.4-1 .9-1 1.7M12 17h.01"/></svg><span>欢迎页 / 帮助</span></button>
  <button class="menu-item" data-act="about"><svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="9"/><path d="M12 16v-5M12 8h.01"/></svg><span>关于</span></button>
</div>

<div class="menu" id="overflowMenu" hidden>
  <button class="menu-item" data-act="wordWrap"><span class="mi-check"></span><span>自动换行</span><kbd>Alt+Z</kbd></button>
  <button class="menu-item" data-act="minimap"><span class="mi-check"></span><span>显示小地图</span></button>
  <button class="menu-item" data-act="lineNumbers"><span class="mi-check"></span><span>显示行号</span></button>
  <button class="menu-item" data-act="whitespace"><span class="mi-check"></span><span>显示空白字符</span></button>
  <button class="menu-item" data-act="sticky"><span class="mi-check"></span><span>粘性滚动</span></button>
  <div class="menu-sep"></div>
  <button class="menu-item" data-act="fontInc"><span>增大字号</span><kbd>Ctrl++</kbd></button>
  <button class="menu-item" data-act="fontDec"><span>减小字号</span><kbd>Ctrl+-</kbd></button>
  <button class="menu-item" data-act="fontReset"><span>重置字号</span></button>
  <div class="menu-sep"></div>
  <button class="menu-item" data-act="toUpper"><span>转为大写</span></button>
  <button class="menu-item" data-act="toLower"><span>转为小写</span></button>
  <button class="menu-item" data-act="sortLines"><span>行排序</span></button>
  <button class="menu-item" data-act="trimTrailing"><span>去除行尾空格</span></button>
  <button class="menu-item" data-act="stats"><span>文档统计…</span></button>
</div>

<!-- ============ 编码选择对话框 ============ -->
<dialog class="dialog" id="dlgEncoding">
  <form method="dialog" class="dialog-form">
    <h2 class="dialog-title" id="dlgEncodingTitle">选择编码</h2>
    <div class="dialog-body">
      <p class="dialog-desc" id="dlgEncodingDesc">选择用于读取文件的字符编码。</p>
      <div class="encoding-search">
        <svg viewBox="0 0 24 24"><circle cx="11" cy="11" r="7"/><path d="M21 21l-4.3-4.3"/></svg>
        <input type="text" id="encFilter" placeholder="搜索编码…" autocomplete="off">
      </div>
      <div class="chip-list" id="encList"></div>
      <label class="switch-row" id="bomRow">
        <span class="switch-label">写入 BOM 字节序标记</span>
        <span class="switch"><input type="checkbox" id="encBom"><span class="switch-track"><span class="switch-thumb"></span></span></span>
      </label>
    </div>
    <div class="dialog-actions">
      <button class="btn text" value="cancel" type="submit">取消</button>
      <button class="btn filled" value="ok" type="submit" id="encOk">确定</button>
    </div>
  </form>
</dialog>

<!-- ============ 设置对话框 ============ -->
<dialog class="dialog" id="dlgSettings">
  <form method="dialog" class="dialog-form">
    <h2 class="dialog-title">设置</h2>
    <div class="dialog-body settings-body">
      <div class="setting-group-title">外观</div>
      <div class="setting-row">
        <span class="setting-label">主题</span>
        <div class="segmented" id="setTheme">
          <button type="button" data-v="light">亮色</button>
          <button type="button" data-v="dark">暗色</button>
          <button type="button" data-v="auto">跟随系统</button>
        </div>
      </div>
      <div class="setting-row">
        <span class="setting-label">字号 <em id="setFontSizeVal">14</em> px</span>
        <input class="slider" type="range" id="setFontSize" min="10" max="28" step="1">
      </div>
      <div class="setting-row">
        <span class="setting-label">字体</span>
        <input class="text-field" type="text" id="setFontFamily" spellcheck="false">
      </div>

      <div class="setting-group-title">编辑器</div>
      <div class="setting-row">
        <span class="setting-label">Tab 大小</span>
        <div class="segmented" id="setTabSize">
          <button type="button" data-v="2">2</button>
          <button type="button" data-v="4">4</button>
          <button type="button" data-v="8">8</button>
        </div>
      </div>
      <label class="switch-row"><span class="switch-label">Tab 键插入空格</span><span class="switch"><input type="checkbox" id="setInsertSpaces"><span class="switch-track"><span class="switch-thumb"></span></span></span></label>
      <label class="switch-row"><span class="switch-label">自动换行</span><span class="switch"><input type="checkbox" id="setWordWrap"><span class="switch-track"><span class="switch-thumb"></span></span></span></label>
      <label class="switch-row"><span class="switch-label">显示小地图</span><span class="switch"><input type="checkbox" id="setMinimap"><span class="switch-track"><span class="switch-thumb"></span></span></span></label>
      <label class="switch-row"><span class="switch-label">显示行号</span><span class="switch"><input type="checkbox" id="setLineNumbers"><span class="switch-track"><span class="switch-thumb"></span></span></span></label>
      <label class="switch-row"><span class="switch-label">高亮当前行</span><span class="switch"><input type="checkbox" id="setHighlightLine"><span class="switch-track"><span class="switch-thumb"></span></span></span></label>
      <label class="switch-row"><span class="switch-label">保存时去除行尾空格</span><span class="switch"><input type="checkbox" id="setTrimOnSave"><span class="switch-track"><span class="switch-thumb"></span></span></span></label>
      <label class="switch-row"><span class="switch-label">保存时确保文件末尾换行</span><span class="switch"><input type="checkbox" id="setFinalNewline"><span class="switch-track"><span class="switch-thumb"></span></span></span></label>

      <div class="setting-group-title">文件</div>
      <div class="setting-row">
        <span class="setting-label">新建文件默认编码</span>
        <select class="text-field" id="setDefaultEncoding"></select>
      </div>
      <div class="setting-row">
        <span class="setting-label">默认行尾序列</span>
        <div class="segmented" id="setDefaultEol">
          <button type="button" data-v="LF">LF</button>
          <button type="button" data-v="CRLF">CRLF</button>
        </div>
      </div>
      <label class="switch-row"><span class="switch-label">自动检测文件编码</span><span class="switch"><input type="checkbox" id="setAutoDetect"><span class="switch-track"><span class="switch-thumb"></span></span></span></label>
      <label class="switch-row"><span class="switch-label">会话恢复（重启后保留未保存内容）</span><span class="switch"><input type="checkbox" id="setSession"><span class="switch-track"><span class="switch-thumb"></span></span></span></label>
      <label class="switch-row"><span class="switch-label">监听本地文件被外部修改<small id="setWatchHint"></small></span><span class="switch"><input type="checkbox" id="setWatchFiles"><span class="switch-track"><span class="switch-thumb"></span></span></span></label>
      <label class="switch-row"><span class="switch-label">无未保存更改时自动重新加载</span><span class="switch"><input type="checkbox" id="setWatchAutoReload"><span class="switch-track"><span class="switch-thumb"></span></span></span></label>

      <div class="setting-group-title">资源镜像</div>
      <div class="setting-row column">
        <span class="setting-label">当前 CDN 源</span>
        <code class="mono-box" id="setCdnCurrent">—</code>
      </div>
      <div class="setting-row column">
        <span class="setting-label">候选镜像（按顺序自动切换）</span>
        <div class="cdn-list" id="setCdnList"></div>
      </div>
    </div>
    <div class="dialog-actions">
      <button class="btn text" value="reset" type="button" id="setResetBtn">恢复默认</button>
      <button class="btn filled" value="ok" type="submit">完成</button>
    </div>
  </form>
</dialog>

<!-- ============ 通用确认对话框 ============ -->
<dialog class="dialog" id="dlgConfirm">
  <form method="dialog" class="dialog-form">
    <h2 class="dialog-title" id="confirmTitle">确认</h2>
    <div class="dialog-body"><p class="dialog-desc" id="confirmDesc"></p></div>
    <div class="dialog-actions" id="confirmActions"></div>
  </form>
</dialog>

<!-- ============ 关于对话框 ============ -->
<dialog class="dialog" id="dlgAbout">
  <form method="dialog" class="dialog-form">
    <h2 class="dialog-title">关于 文本编辑器</h2>
    <div class="dialog-body">
      <p class="dialog-desc">基于 Monaco Editor 的纯前端文本编辑器，Material Design 3 界面。</p>
      <ul class="about-list" id="aboutList"></ul>
    </div>
    <div class="dialog-actions"><button class="btn filled" value="ok" type="submit">知道了</button></div>
  </form>
</dialog>

<div class="snackbar" id="snackbar" hidden><span id="snackText"></span><button class="snack-action" id="snackAction" hidden></button></div>
